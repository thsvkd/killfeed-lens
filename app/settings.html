<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'">
<title>killfeed-lens · 설정</title>
<link rel="stylesheet" href="node_modules/pretendard/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main class="page">
  <h1>설정 <span class="applied">바꾸면 바로 적용됩니다</span></h1>

  <section class="group" aria-labelledby="h-general">
    <h2 id="h-general">일반</h2>
    <div class="card">
      <fieldset class="row radios">
        <legend>닫기(X) 버튼</legend>
        <label class="opt">
          <input type="radio" name="close" value="tray">
          <span class="dot" aria-hidden="true"></span>
          <span class="txt"><span class="lbl">트레이로 숨기고 계속 실행 <em>(권장)</em></span><small>창을 닫아도 캡처와 오버레이는 계속 동작합니다. 종료는 트레이 아이콘 메뉴의 ‘종료’.</small></span>
        </label>
        <label class="opt">
          <input type="radio" name="close" value="quit">
          <span class="dot" aria-hidden="true"></span>
          <span class="txt"><span class="lbl">앱 종료</span><small>창을 닫으면 캡처와 오버레이도 함께 끝납니다.</small></span>
        </label>
      </fieldset>
      <button id="login" class="row sw" type="button" role="switch" aria-checked="false" aria-labelledby="l-login" aria-describedby="d-login">
        <span class="txt"><span id="l-login" class="lbl">Windows 시작 시 자동 실행</span><small id="d-login"></small></span>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </button>
      <button id="hidden" class="row sw" type="button" role="switch" aria-checked="false" aria-labelledby="l-hidden" aria-describedby="d-hidden">
        <span class="txt"><span id="l-hidden" class="lbl">트레이로 조용히 시작 (창을 띄우지 않음)</span><small id="d-hidden">실행하면 팀 현황 창 없이 트레이에서만 시작합니다.</small></span>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </button>
    </div>
  </section>

  <section class="group" aria-labelledby="h-overlay">
    <h2 id="h-overlay">오버레이</h2>
    <div class="card">
      <button id="overlay" class="row sw" type="button" role="switch" aria-checked="false" aria-labelledby="l-overlay" aria-describedby="d-overlay">
        <span class="txt"><span id="l-overlay" class="lbl">오버레이 표시</span><small id="d-overlay">게임 화면 위에 팀 현황을 띄웁니다. 팀 현황 창의 오버레이 스위치와 같은 설정입니다.</small></span>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </button>
      <p class="row info">
        <span class="lbl">단축키</span>
        <span class="val"><kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>O</kbd> <span id="hotkey-state" class="state" role="status"></span></span>
      </p>
    </div>
  </section>

  <section class="group" aria-labelledby="h-debug">
    <h2 id="h-debug">검증용 기록</h2>
    <div class="card">
      <button id="crops" class="row sw" type="button" role="switch" aria-checked="false" aria-labelledby="l-crops" aria-describedby="d-crops" disabled>
        <span class="txt"><span id="l-crops" class="lbl">킬피드 이벤트 이미지 저장 (검증·개선용, 7일 뒤 자동 삭제)</span><small id="d-crops">엔진 연결 후 설정 가능</small></span>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
      </button>
    </div>
  </section>

  <section class="group" aria-labelledby="h-about">
    <h2 id="h-about">정보</h2>
    <div class="card">
      <p class="row info">
        <span class="lbl">버전</span>
        <span id="version" class="val num">-</span>
      </p>
      <div class="row update-row">
        <span class="txt"><span class="lbl">앱 업데이트</span><small id="update-status" role="status" aria-live="polite"></small></span>
        <button id="update-action" type="button" class="btn" disabled>설치판에서 사용</button>
      </div>
      <progress id="update-progress" max="100" value="0" aria-label="업데이트 다운로드 진행률" hidden></progress>
      <div class="row actions">
        <button id="open-data" type="button" class="btn">데이터 폴더 열기</button>
        <button id="open-logs" type="button" class="btn">로그 폴더 열기</button>
        <button id="open-updates" type="button" class="btn">업데이트 로그</button>
      </div>
    </div>
  </section>
</main>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
