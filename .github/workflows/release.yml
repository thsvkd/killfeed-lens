name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Check tag matches pyproject version
        run: uv run --no-project python scripts/release_tag.py

      - name: Setup Node (Electron app)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows
        shell: pwsh
        run: .\script\package.ps1

      - name: Collect release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # The portable exe is dropped while the Electron UI settles; only the installer ships.
          body: |
            Windows x64 설치 파일을 배포합니다. portable exe는 당분간 제공하지 않습니다.
            0.5.0부터 설정 → 정보 → 앱 업데이트에서 새 버전을 확인·다운로드·적용할 수 있습니다.
            0.4.1 이하를 쓰고 있다면 OTA가 포함된 새 설치 파일을 한 번 직접 설치해 주세요.
          fail_on_unmatched_files: true
          files: release-assets/*-setup.exe
